  function $(id){ return document.getElementById(id); }
  function el(tag, cls, html){
    var e = document.createElement(tag);

    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function storageGet(key, fallback){
    try{
      var raw = localStorage.getItem(CONFIG.STORAGE_PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function storageSet(key, value){
    try{ localStorage.setItem(CONFIG.STORAGE_PREFIX + key, JSON.stringify(value)); }catch(e){}
  }
  function haversine(a, b){
    var R = 6371000;
    var dLat = (b.lat-a.lat) * Math.PI/180;
    var dLng = (b.lng-a.lng) * Math.PI/180;
    var s = Math.sin(dLat/2)*Math.sin(dLat/2) +
      Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }

    var bx = B.lng-A.lng, by = B.lat-A.lat;
    var px = P.lng-A.lng, py = P.lat-A.lat;
    var cross = bx*py - by*px;
    if(cross > 0) return 1;
    if(cross < 0) return -1;
    return 0;
  }

    var auto = autoFill(raw.categoryName, raw.name);
    var includedByGeometry = raw.includedByGeometry !== undefined ? raw.includedByGeometry : true;
    var manualOverride = ('manualOverride' in saved) ? saved.manualOverride : null;
    return {
      id: raw.id, source: raw.source, name: raw.name, categoryName: raw.categoryName || '',
      phone: raw.phone || '', address: raw.address || '', lat: raw.lat, lng: raw.lng,
      distanceM: raw.distanceM, placeUrl: raw.placeUrl || '',
      railSide: raw.railSide !== undefined ? raw.railSide : null,
      includedByGeometry: includedByGeometry,
      manualOverride: manualOverride,
      isIncluded: manualOverride === null ? includedByGeometry : manualOverride,
      tags: {
        type: saved.tags ? saved.tags.type : (raw.type || auto.type),
        taste: saved.tags ? saved.tags.taste : (raw.taste || auto.taste),
        cuisine: saved.tags ? saved.tags.cuisine : (raw.cuisine || auto.cuisine)
      },
      signatureMenu: saved.signatureMenu !== undefined ? saved.signatureMenu : (raw.signatureMenu || auto.signatureMenu),
      otherMenu: saved.otherMenu !== undefined ? saved.otherMenu : (raw.otherMenu || []),
      edited: !!saved.edited
    };
  }

  function setRestaurants(rawList){
    var overrides = loadOverrides();
    state.restaurants = rawList.map(function(r){ return mergeRecord(r, overrides); });
  }

  // ============ Adapter B: seed(fallback) ============
  function getSeedRestaurants(){
    return SEED_RESTAURANTS.map(function(s){
      return {
        id:s.id, source:'seed', name:s.name, categoryName:s.categoryName, distanceM:s.distanceM,
        includedByGeometry:true, railSide:null,
        type:s.type, taste:s.taste, cuisine:s.cuisine,
        signatureMenu:s.signatureMenu, otherMenu:s.otherMenu
      };
    });
  }

  // ============ Adapter A: 카카오 라이브 검색 ============
  function loadKakaoSdk(){
    return new Promise(function(resolve, reject){
      if(!CONFIG.KAKAO_JS_KEY || CONFIG.KAKAO_JS_KEY === 'YOUR_KAKAO_JAVASCRIPT_KEY'){
        reject(new Error('KAKAO_JS_KEY not configured'));
        return;
      }
      var done = false;
      var timer = setTimeout(function(){
        if(!done){ done = true; reject(new Error('kakao sdk load timeout')); }
      }, CONFIG.SDK_LOAD_TIMEOUT_MS);
      var script = document.createElement('script');
      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(CONFIG.KAKAO_JS_KEY) + '&libraries=services&autoload=false';
      script.onload = function(){
        if(done) return; done = true; clearTimeout(timer);
        if(window.kakao && window.kakao.maps){ resolve(); }
        else { reject(new Error('kakao global missing after load')); }
      };
      script.onerror = function(){
        if(done) return; done = true; clearTimeout(timer);
        reject(new Error('kakao sdk script error (CSP block or network)'));
      };
      document.head.appendChild(script);
    });
  }

  function kakaoReady(){
    return new Promise(function(resolve){ kakao.maps.load(resolve); });
  }

  function geocodeAddress(geocoder, address){
    return new Promise(function(resolve, reject){
      geocoder.addressSearch(address, function(result, status){
        if(status === kakao.maps.services.Status.OK && result[0]){
          resolve({ lat:+result[0].y, lng:+result[0].x });
        } else { reject(new Error('geocode failed: ' + status)); }
      });
    });
  }

  // 카카오 키워드 검색은 관련도 순으로 여러 결과를 주는데, "가산디지털단지역" 같은
  // 환승역은 노선별로 여러 건(1호선/7호선 등)이 나오고 순서도 뒤섞여 있다.
  // 철길 판정 기준은 반드시 1호선이어야 하므로 category_name/place_name에
  // preferKeyword(예: "1호선")가 포함된 결과를 우선으로 고른다.
  function keywordFirst(places, query, preferKeyword){
    return new Promise(function(resolve, reject){
      places.keywordSearch(query, function(data, status){
        if(status === kakao.maps.services.Status.OK && data[0]){
          var picked = data[0];
          if(preferKeyword){
            for(var i=0;i<data.length;i++){
              var hay = (data[i].category_name||'') + ' ' + (data[i].place_name||'');
              if(hay.indexOf(preferKeyword) !== -1){ picked = data[i]; break; }
            }
          }
          resolve({ lat:+picked.y, lng:+picked.x });
        } else { reject(new Error('keyword search failed: ' + status)); }
      });
    });
  }

  function categorySearchAll(places, center, radius){
    return new Promise(function(resolve, reject){
      var all = [];
      places.categorySearch('FD6', function(data, status, pagination){
        if(status !== kakao.maps.services.Status.OK){ reject(new Error('category search failed: '+status)); return; }
        all = all.concat(data);
        if(pagination.hasNextPage){ pagination.nextPage(); }
        else { resolve(all); }
      }, { location: new kakao.maps.LatLng(center.lat, center.lng), radius: radius, sort: kakao.maps.services.SortBy.DISTANCE });
    });
  }

  function fetchLiveRestaurants(){
    var geocoder = new kakao.maps.services.Geocoder();
    var places = new kakao.maps.services.Places();
    var officeCoord, stationA, stationB;

    return geocodeAddress(geocoder, CONFIG.OFFICE_ADDRESS).then(function(coord){
      officeCoord = coord;
      return Promise.all([
        keywordFirst(places, CONFIG.RAIL_STATION_A_QUERY, '1호선'),
        keywordFirst(places, CONFIG.RAIL_STATION_B_QUERY, '1호선')
      ]).catch(function(){ return null; }); // 철길 판정 실패해도 전체 흐름은 계속
    }).then(function(stations){
      if(stations){
        stationA = stations[0]; stationB = stations[1];
        state.railAvailable = true;
        state.officeSign = crossSign(stationA, stationB, officeCoord);
      } else {
        state.railAvailable = false;
      }
      return categorySearchAll(places, officeCoord, CONFIG.RADIUS_M);
    }).then(function(raw){
      return raw.map(function(p){
        var lat = +p.y, lng = +p.x;
        var distanceM = p.distance ? Number(p.distance) : Math.round(haversine(officeCoord, {lat:lat,lng:lng}));
        var side = state.railAvailable ? crossSign(stationA, stationB, {lat:lat,lng:lng}) : null;
        var includedByGeometry = distanceM <= CONFIG.RADIUS_M && (!state.railAvailable || side === state.officeSign);
        return {
          id: 'kakao:' + p.id, source:'kakao', name: p.place_name, categoryName: p.category_name,
          phone: p.phone, address: p.road_address_name || p.address_name, lat: lat, lng: lng,
          distanceM: distanceM, placeUrl: p.place_url, railSide: side, includedByGeometry: includedByGeometry
        };
      });
    }).then(function(list){
      return { list: list, officeCoord: officeCoord };
    });
  }

  // ============ 지도 렌더 ============
  function renderMap(officeCoord){
    if(state.mode !== 'live' || !window.kakao || !kakao.maps) return;
    var container = $('map');
    var center = new kakao.maps.LatLng(officeCoord.lat, officeCoord.lng);
    var map = new kakao.maps.Map(container, { center:center, level:4 });
    state.map = map;
    new kakao.maps.Marker({ position:center, map:map });
    new kakao.maps.Circle({
      center:center, radius:CONFIG.RADIUS_M, strokeWeight:2, strokeColor:'#ff6b35', strokeOpacity:.8,
      fillColor:'#ff6b35', fillOpacity:.12, map:map
    });
    state.restaurants.forEach(function(r){
      if(r.lat == null || r.lng == null) return;
      var pos = new kakao.maps.LatLng(r.lat, r.lng);
      var marker = new kakao.maps.Marker({ position:pos, map:map, opacity: r.isIncluded ? 1 : 0.35 });
      var iw = new kakao.maps.InfoWindow({ content:'<div style="padding:4px 8px;font-size:12px;white-space:nowrap;">'+r.name+'</div>' });
      kakao.maps.event.addListener(marker, 'click', function(){ iw.open(map, marker); });
    });
  }

  // ============ 필터/추천 ============
  function toggleSelected(group, value){
    var arr = state.selected[group];
    var idx = arr.indexOf(value);
    if(idx === -1) arr.push(value); else arr.splice(idx,1);
  }
  function matchesTags(r){
    var sel = state.selected;
    var typeOk = sel.type.length === 0 || sel.type.some(function(t){ return r.tags.type.indexOf(t) !== -1; });
    var tasteOk = sel.taste.length === 0 || sel.taste.indexOf(r.tags.taste) !== -1;
    var cuisineOk = sel.cuisine.length === 0 || sel.cuisine.indexOf(r.tags.cuisine) !== -1;
    return typeOk && tasteOk && cuisineOk;
  }
  function candidatePool(){
    return state.restaurants.filter(function(r){ return r.isIncluded && matchesTags(r); });
  }
  function pickRandom(){
    var pool = candidatePool();
    if(pool.length === 0) return null;
    var fresh = pool.filter(function(r){ return state.recentIds.indexOf(r.id) === -1; });
    var from = fresh.length > 0 ? fresh : pool;
    var chosen = from[Math.floor(Math.random()*from.length)];
    state.recentIds.push(chosen.id);
    if(state.recentIds.length > Math.max(1, pool.length - 1)) state.recentIds.shift();
    return chosen;
  }

  // ============ 렌더링 ============
  function renderChips(){
    renderChipGroup('chips-type', TYPE_OPTIONS, 'type');
    renderChipGroup('chips-taste', TASTE_OPTIONS, 'taste');
    renderChipGroup('chips-cuisine', CUISINE_OPTIONS, 'cuisine');
  }
  function renderChipGroup(containerId, options, group){
    var c = $(containerId);
    c.innerHTML = '';
    options.forEach(function(opt){
      var chip = el('button', 'chip' + (state.selected[group].indexOf(opt)!==-1 ? ' active' : ''), opt);
      chip.type = 'button';
      chip.addEventListener('click', function(){
        toggleSelected(group, opt);
        renderChips();
        updateCtaState();
      });
      c.appendChild(chip);
    });
  }
  function updateCtaState(){
    var pool = candidatePool();
    var btn = $('recommendBtn'), help = $('ctaHelp');
    if(pool.length === 0){
      btn.disabled = true;
      help.hidden = false;
      help.textContent = '선택한 조건에 맞는 식당이 없어요. 조건을 줄여보세요.';
    } else {
      btn.disabled = false;
      help.hidden = true;
    }
  }
  function renderResult(r){
    var card = $('resultCard');
    if(!r){ card.hidden = true; return; }
    card.hidden = false;
    $('resultName').textContent = r.name;
    var metaParts = [];
    if(r.categoryName) metaParts.push(r.categoryName.replace(/^음식점\s*>\s*/,''));
    if(r.distanceM != null) metaParts.push(r.distanceM + 'm');
    $('resultMeta').textContent = metaParts.join(' · ');
    $('resultSignature').textContent = r.signatureMenu || '(추천메뉴 미입력 — 아래 목록에서 편집해주세요)';
    var ul = $('resultOther'); ul.innerHTML = '';
    (r.otherMenu||[]).forEach(function(m){ ul.appendChild(el('li', null, m)); });
    if((r.otherMenu||[]).length === 0){ ul.appendChild(el('li', null, '(다른메뉴 미입력)')); }
    var link = $('resultMapLink');
    if(r.placeUrl){ link.href = r.placeUrl; link.style.display = ''; }
    else { link.href = 'https://map.kakao.com/?q=' + encodeURIComponent(r.name); link.style.display = ''; }
  }
  function onRecommend(){
    var r = pickRandom();
    renderResult(r);
  }

  function renderList(){
    var body = $('listBody');
    body.innerHTML = '';
    if(state.restaurants.length === 0){
      body.appendChild(el('div','empty-state','아직 불러온 식당이 없어요.'));
      return;
    }
    state.restaurants.slice().sort(function(a,b){ return (a.distanceM||0)-(b.distanceM||0); }).forEach(function(r){
      body.appendChild(buildRow(r));
    });
  }
  function buildRow(r){
    var row = el('div', 'r-row' + (r.isIncluded ? '' : ' excluded'));
    var top = el('div','r-row-top');
    top.appendChild(el('div','r-row-name', r.name + (r.edited ? '<span class="badge">수정됨</span>' : '')));
    top.appendChild(el('div','r-row-dist', (r.distanceM!=null? r.distanceM+'m':'')));
    row.appendChild(top);
    row.appendChild(el('div','r-row-cat', r.categoryName || ''));

    var sideToggle = el('div','side-toggle');
    var opts = [ ['auto','자동',null], ['in','포함',true], ['out','제외',false] ];
    opts.forEach(function(o){
      var b = el('button', 'toggle-' + o[0] + (r.manualOverride === o[2] ? ' on' : ''), o[1]);
      b.type = 'button';
      b.addEventListener('click', function(){
        var patch = { manualOverride: o[2] };
        var saved = saveOverride(r.id, patch);
        r.manualOverride = saved.manualOverride;
        r.isIncluded = r.manualOverride === null ? r.includedByGeometry : r.manualOverride;
        renderList(); updateCtaState();
      });
      sideToggle.appendChild(b);
    });
    row.appendChild(sideToggle);

    var editToggle = el('button','edit-toggle','정보 편집');
    editToggle.type = 'button';
    var form = buildEditForm(r);
    editToggle.addEventListener('click', function(){ form.classList.toggle('open'); });
    row.appendChild(editToggle);
    row.appendChild(form);
    return row;
  }
  function buildEditForm(r){
    var form = el('div','edit-form');

    var typeLabel = el('label', null, '형태 (복수 선택)');
    form.appendChild(typeLabel);
    var typeChips = el('div','chips');
    var localType = r.tags.type.slice();
    TYPE_OPTIONS.forEach(function(opt){
      var chip = el('button','chip'+(localType.indexOf(opt)!==-1?' active':''), opt);
      chip.type='button';
      chip.addEventListener('click', function(){
        var idx = localType.indexOf(opt);
        if(idx===-1) localType.push(opt); else localType.splice(idx,1);
        chip.classList.toggle('active');
      });
      typeChips.appendChild(chip);
    });
    form.appendChild(typeChips);

    form.appendChild(el('label', null, '맛'));
    var tasteSelect = el('select');
    TASTE_OPTIONS.forEach(function(opt){
      var o = el('option', null, opt); o.value = opt;
      if(opt === r.tags.taste) o.selected = true;
      tasteSelect.appendChild(o);
    });
    form.appendChild(tasteSelect);

    form.appendChild(el('label', null, '종류'));
    var cuisineSelect = el('select');
    CUISINE_OPTIONS.forEach(function(opt){
      var o = el('option', null, opt); o.value = opt;
      if(opt === r.tags.cuisine) o.selected = true;
      cuisineSelect.appendChild(o);
    });
    form.appendChild(cuisineSelect);

    form.appendChild(el('label', null, '추천메뉴 (대표메뉴 1개)'));
    var sigInput = el('input'); sigInput.type='text'; sigInput.value = r.signatureMenu || '';
    form.appendChild(sigInput);

    form.appendChild(el('label', null, '다른메뉴 (쉼표로 구분)'));
    var otherInput = el('textarea'); otherInput.value = (r.otherMenu||[]).join(', ');
    form.appendChild(otherInput);

    var saveBtn = el('button','btn primary','저장');
    saveBtn.type='button';
    saveBtn.style.marginTop = '8px';
    saveBtn.addEventListener('click', function(){
      var otherMenu = otherInput.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var patch = {
        tags: { type: localType, taste: tasteSelect.value, cuisine: cuisineSelect.value },
        signatureMenu: sigInput.value.trim(),
        otherMenu: otherMenu,
        edited: true
      };
      var saved = saveOverride(r.id, patch);
      r.tags = saved.tags; r.signatureMenu = saved.signatureMenu; r.otherMenu = saved.otherMenu; r.edited = true;
      renderList(); updateCtaState();
    });
    form.appendChild(saveBtn);
    return form;
  }

  function renderAll(officeCoord){
    renderChips();
    updateCtaState();
    renderList();
    if(state.mode === 'live' && officeCoord){
      $('mapCard').hidden = false;
      renderMap(officeCoord);
    } else {
      $('mapCard').hidden = true;
    }
    $('lastSearchAt').textContent = '마지막 검색: ' + new Date().toLocaleString('ko-KR');
    storageSet('lastSearchAt', new Date().toISOString());
    // 처음 열었을 때도 바로 추천 결과가 보이도록 자동으로 한 번 뽑아둔다.
    if(candidatePool().length > 0){ onRecommend(); } else { renderResult(null); }
  }

  function showFallbackBanner(msg){
    var b = $('fallbackBanner');
    b.hidden = false;
    if(msg){ b.firstChild ? (b.childNodes[0].textContent = msg) : null; }
  }
  function hideFallbackBanner(){ $('fallbackBanner').hidden = true; }

  // ============ 부트스트랩 ============
  function init(){
    state.recentIds = [];
    loadKakaoSdk()
      .then(kakaoReady)
      .then(fetchLiveRestaurants)
      .then(function(res){
        state.mode = 'live';
        hideFallbackBanner();
        setRestaurants(res.list);
        renderAll(res.officeCoord);
      })
      .catch(function(err){
        console.warn('[lunch-recommender] 카카오 라이브 검색 실패, 예시 데이터로 대체합니다:', err && err.message);
        state.mode = 'seed';
        showFallbackBanner();
        setRestaurants(getSeedRestaurants());
        renderAll(null);
      });
  }

  document.addEventListener('DOMContentLoaded', function(){
    $('recommendBtn').addEventListener('click', onRecommend);
    $('rerollBtn').addEventListener('click', onRecommend);
    $('resetFilters').addEventListener('click', function(){
      state.selected = { type:[], taste:[], cuisine:[] };
      renderChips(); updateCtaState();
    });
    $('researchBtn').addEventListener('click', init);
    $('retryLiveBtn').addEventListener('click', init);
    init();
  });
})();
</script>

</body></html>
